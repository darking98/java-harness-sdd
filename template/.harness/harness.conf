# harness.conf — comandos de verificación de ESTE repo.
# Lo genera /java-harness-sdd:install-harness inspeccionando el build; editalo
# libremente. Lo leen (source) init.sh y los hooks del plugin, así que tiene que
# ser bash válido. Todos los comandos corren desde la raíz del repo.

# gradle | maven
BUILD_TOOL="gradle"

# Versión de Java del proyecto (solo advierte si el PATH no coincide: el build
# puede usar un toolchain propio). El validador del harness necesita JDK 17+.
JAVA_MIN_VERSION="21"

# Verificación rápida: compila main + test y corre los tests que no levantan
# Spring ni contenedores. En hexagonal, dominio, aplicación y ArchUnit tienen
# que ser puros: si alguno de esos tests levanta contexto, es un problema del
# test, no del filtro.
FAST_TEST_CMD="./gradlew test --tests '*.architecture.*' --tests '*.domain.*' --tests '*.application.*' -q"

# Verificación completa: lo mismo que corre CI.
FULL_VERIFY_CMD="./gradlew build"

# true si FULL_VERIFY_CMD necesita Docker (Testcontainers).
REQUIRES_DOCKER_FOR_FULL="true"

# Rama contra la que van los PRs del equipo (main, dev, ...). init.sh avisa si la
# rama actual tiene commits pendientes de origin/<BASE_BRANCH>, según el último
# fetch: no hace fetch él, eso es del humano. Vacío desactiva el chequeo.
BASE_BRANCH=""

# Formato de las claves de ticket (name de cada feature).
JIRA_KEY_PATTERN='^[A-Z][A-Z0-9]+-[0-9]+$'

# Rutas (relativas a la raíz) que solo puede editar el implementer, y solo con
# una feature en in_progress. Separadas por espacio; un directorio cubre todo lo
# que tiene adentro. Las que no existen se ignoran. En multi-módulo, sumá las
# raíces de cada módulo (<modulo>/src, <modulo>/build.gradle): git status solo
# mira las rutas listadas.
PROTECTED_PATHS="src buildSrc build.gradle build.gradle.kts settings.gradle settings.gradle.kts gradle.properties gradle pom.xml .mvn"
